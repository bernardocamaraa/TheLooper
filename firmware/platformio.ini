; PlatformIO project file - firmware do controlador (Arduino Mega 2560)
; https://docs.platformio.org/page/projectconf.html

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
    -std=gnu++14
    -I../shared
